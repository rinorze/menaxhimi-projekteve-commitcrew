name: Design task
description: Research, wireframes, hi-fi screens, assets, usability tests.
title: "<deliverable>"
labels: ["type: design", "area: design"]
assignees: ["rinorze"]
projects: ["rinorze/1"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Which user problem or screen does this solve?
    validations:
      required: true
  - type: textarea
    id: deliverables
    attributes:
      label: Deliverables
      value: |
        - [ ] Figma frames: 
        - [ ] States: loading / empty / error / offline
        - [ ] Albanian + English copy
        - [ ] Handoff: link added to the implementation issue
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] Reviewed with the developer who builds it
        - [ ] Meets the accessibility checklist (contrast, touch targets, labels)
  - type: input
    id: figma
    attributes:
      label: Figma link
